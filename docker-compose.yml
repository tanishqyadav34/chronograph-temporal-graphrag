# ChronoGraph — one-command local stack
#
# Starts the Next.js app plus every backing service it needs (Neo4j).
#
#   docker compose up --build
#
# Then:
#   - App:        http://localhost:3000
#   - Neo4j UI:   http://localhost:7474  (neo4j / devpassword — dev only!)
#
# Set your GROK_API_KEY in .env for the chat pipeline to work end-to-end.

services:
  neo4j:
    image: neo4j:5
    container_name: chronograph-neo4j
    environment:
      NEO4J_AUTH: neo4j/devpassword
      # Memory tuned for local dev; raise for real workloads.
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474" # HTTP (browser UI)
      - "7687:7687" # Bolt (drivers)
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: chronograph-app
    depends_on:
      neo4j:
        condition: service_healthy
    environment:
      # Point the app at the compose-local Neo4j (overrides .env for the container).
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: devpassword
      NEO4J_DATABASE: neo4j
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: dev-secret-change-me
      # Pass your Groq key through from the host .env (not set = app still boots).
      GROK_API_KEY: ${GROK_API_KEY:-}
    ports:
      - "3000:3000"

volumes:
  neo4j_data:
