# ChronoGraph CI: lint + typecheck + tests + coverage + audits for both stacks.
#
# - Node job: ESLint, tsc --noEmit, Jest with enforced 70% coverage thresholds,
#   and an npm audit gate (allowlisted advisories via scripts/audit-check.mjs)
# - Python job: pytest with coverage over extraction/ and ingestion/ (offline;
#   live Neo4j tests are opt-in via CHRONO_LIVE_NEO4J and stay skipped in CI),
#   pip check for environment consistency, and pip-audit for CVEs

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Lint, typecheck & test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      # Jest runs with collectCoverage + coverageThreshold (70% global).
      - name: Test (Jest, coverage gate)
        run: npm test

      # Fails on any high/critical advisory not documented in
      # scripts/audit-allowlist.json (10 reviewed next@14 advisories that are
      # only fixed by the breaking Next 16 migration).
      - name: Dependency audit (npm)
        run: node scripts/audit-check.mjs

  python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Catches broken/ conflicting dependency resolution after install.
      - name: Dependency consistency check
        run: pip check

      # Coverage thresholds come from .coveragerc (fail_under = 30, offline
      # baseline — live Neo4j tests stay skipped in CI).
      - name: Test (pytest, coverage gate)
        run: pytest extraction/ ingestion/ -q --cov=extraction --cov=ingestion

      # Advisory audit for the Python dependency set.
      - name: Dependency audit (pip-audit)
        run: |
          pip install pip-audit
          pip-audit --skip-editable -r requirements.txt

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t chronograph:ci .
