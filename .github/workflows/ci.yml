# ChronoGraph CI: lint + typecheck + tests for both stacks.
#
# - Node job: ESLint, tsc --noEmit, Jest (lib + component tests)
# - Python job: pytest over extraction/ and ingestion/ (offline; live Neo4j
#   tests are opt-in via CHRONO_LIVE_NEO4J and stay skipped in CI)

name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  node:
    name: Lint, typecheck & test (Node)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Test (Jest)
        run: npm test

  python:
    name: Test (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Test (pytest)
        # No CHRONO_LIVE_NEO4J here: live Neo4j tests stay skipped in CI.
        run: pytest extraction/ ingestion/ -q

  docker:
    name: Docker build smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build app image
        run: docker build -t chronograph:ci .
